[provider]
endpoint = "https://api.openai.com/v1/chat/completions"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60

[projects.example-service]
name = "Example service"
path = "../example-service"
# Optional: also assess GitHub issues, pull requests, and discussions.
# Requires GITHUB_TOKEN to be set in the environment (read access only).
# github_repo = "owner/example-service"

[projects.example-library]
name = "Example library"
path = "../example-library"

[assessment]
output_dir = "../projectmesh-assessments"

# Alternative: use a local Claude Code subscription (no API key needed)
# [provider]
# type            = "claude-cli"
# model           = "sonnet"
# timeout_seconds = 300

# Optional: route one analysis to a different model. Unset keys inherit from
# [provider] when the type matches; switching type starts from the override.
# [agents.code_analysis]
# model = "opus"
#
# [agents.spec_analysis]
# type            = "claude-cli"
# model           = "sonnet"
# timeout_seconds = 300
